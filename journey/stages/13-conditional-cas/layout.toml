files = ["src/minis3/store.py", "tests/test_conditional.py"]

[[blocks]]
id = "public-wiring"
title_en = "Public export wiring"
title_zh = "公开导出接线"
summary_en = "Expose conditional failures while keeping matching and mutation ownership in the two core blocks."
