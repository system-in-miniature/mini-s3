site_name: MiniS3 Tutorial
site_description: A chapter-oriented guide to object-storage mechanisms in miniature
site_url: https://system-in-miniature.github.io/mini-s3/
repo_url: https://github.com/system-in-miniature/mini-s3
repo_name: system-in-miniature/mini-s3
docs_dir: docs

theme:
  name: material
  logo: assets/brand/avatar.svg
  favicon: assets/brand/avatar.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

