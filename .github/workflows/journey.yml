name: Journey chain

on:
  push:
    branches: [main]
    paths:
      - "journey/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/journey.yml"
permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Rebuild and verify every Journey stage
        run: python journey/tools/build_journey.py --check
