name: Journey chain

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Rebuild and verify every Journey stage
        run: python journey/tools/build_journey.py --check
